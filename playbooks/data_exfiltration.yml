id: data_exfiltration_response
name: High-Volume Data Exfiltration Response
enabled: true
min_risk_score: 70
severity_threshold: high
triggers:
  - type: alert_type
    alert_type: data_exfiltration
    count: 1
    window_minutes: 15
actions:
  - type: contain
    action: block_ip
    target: "{{source_ip}}"
  - type: contain
    action: disable_user
    target: "{{user}}"
  - type: notify
    channel: slack
    message: "ALERT: Unauthorized data exfiltration to external IP {{source_ip}} initiated by {{user}}. Case: {{case_id}}"
